name: Update Gantt

on:
  push:
    branches: [main]
    paths:
      - schedule.json
      - scripts/**
      - site/**
      - tests/**
      - README.md
      - docs/gantt.mmd
      - .github/workflows/update-gantt.yml
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-gantt-main
  cancel-in-progress: false

jobs:
  update:
    name: Validate, render, and sync
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Test the generator
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/gantt-core.test.mjs

      - name: Generate and commit chart updates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update_gantt.py
          git add -- README.md docs/gantt.mmd
          if git diff --cached --quiet; then
            echo "Gantt is already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: sync generated Gantt chart'
          git push origin HEAD:main

      - name: Publish run summary
        run: cat README.md >> "$GITHUB_STEP_SUMMARY"

  website:
    name: Publish independent Gantt interface
    needs: update
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the synchronized source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the standalone interface
        run: python3 scripts/build_site.py
      - name: Upload the static website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
